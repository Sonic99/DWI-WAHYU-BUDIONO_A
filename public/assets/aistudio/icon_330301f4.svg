<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Gold Decorative Ring -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4" />

  <!-- Central Emblem / Calendar Board -->
  <g filter="url(#shadow)">
    <!-- Calendar Body -->
    <rect x="106" y="126" width="300" height="270" rx="36" fill="#ffffff" />
    <!-- Calendar Header -->
    <path d="M 106 162 C 106 142 122 126 142 126 L 370 126 C 390 126 406 142 406 162 L 406 206 L 106 206 Z" fill="#047857" />
    <!-- Calendar Rings -->
    <rect x="160" y="96" width="24" height="56" rx="12" fill="url(#goldGrad)" />
    <rect x="328" y="96" width="24" height="56" rx="12" fill="url(#goldGrad)" />
    
    <!-- Big Checkmark -->
    <circle cx="256" cy="300" r="64" fill="#ecfdf5" stroke="#10b981" stroke-width="6" />
    <path d="M 226 300 L 246 322 L 290 274" fill="none" stroke="#047857" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Stars Decoration -->
  <polygon points="256,40 262,56 278,56 265,66 270,82 256,72 242,82 247,66 234,56 250,56" fill="url(#goldGrad)" />
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">E-PRESENSI</text>
</svg>
